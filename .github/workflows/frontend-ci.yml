name: Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cse-3100/client

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './cse-3100/client/package-lock.json'
        
    - name: Install dependencies
      run: npm install

    - name: Run Linter
      run: npm run lint || echo "Linting failed but continuing to build..."

    - name: Build frontend
      run: npm run build
